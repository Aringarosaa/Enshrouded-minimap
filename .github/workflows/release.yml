name: Build Minimap Clear View

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build minimap_mod.dll
        shell: pwsh
        run: |
          msbuild ./minimap_mod.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 `
            "/p:OutDir=$PWD\build\bin\" "/p:IntDir=$PWD\build\obj\"
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Package mod folder
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'dist\Minimap_ClearView'
          $modDir = Join-Path $stage 'mods\minimap_mod'
          New-Item -ItemType Directory -Path $modDir -Force | Out-Null
          Copy-Item build\bin\minimap_mod.dll $modDir
          Get-ChildItem assets | ForEach-Object { Copy-Item $_.FullName $modDir -Recurse }
          foreach ($name in 'README.md', 'README-INSTALL.txt', 'CREDITS.md', 'LICENSE', 'CLEAR-VIEW.md') {
            Copy-Item $name $stage
          }
          Copy-Item docs $stage -Recurse
          Copy-Item shroudtopia.example.json $stage
          $sums = Get-ChildItem $stage -Recurse -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.FullName.Substring($stage.Length + 1).Replace('\', '/'))"
          }
          $sums | Set-Content (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Minimap_ClearView-${{ github.sha }}
          path: dist/Minimap_ClearView
          if-no-files-found: error
          retention-days: 90
